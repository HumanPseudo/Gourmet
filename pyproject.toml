[dependency-groups]
cog = [
  "cogapp==3.6.0",
  "goodconf[yaml]==7.0.0",
]
dev = [
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==6.3.0",
  "django-stubs==6.0.3",
  "djlint==1.36.4",
  "mypy==1.20.2",
  "pytest-cov==7.1.0",
  "pytest-django==4.12.0",
  "pytest-env==1.6.0",
  "pytest-socket==0.7.0",
  "pytest-xdist==3.8.0",
  "pytest==9.0.3",
  "readable-log-formatter==0.1.4",
  "ruff==0.15.13",
  "types-requests==2.33.0.20260408",
]
prod = [
    "gunicorn==25.3.0",
]

[project]
dependencies = [
  "dj-database-url==3.1.2",
  "django-alive==2.0.0",
  "django-cors-headers==4.9.0",
  "django-ninja==1.6.2",
  "django==6.0.5",
  "goodconf[yaml]==7.0.0",
  "gunicorn==25.3.0",
  "psycopg==3.3.3",
  "python-json-logger==4.1.0",
  "requests==2.33.1",
  "sentry-sdk==2.58.0",
  "whitenoise==6.12.0",
  "wsgi-basic-auth==1.1.0",
]
name = "gourmet"
requires-python = ">=3.12"
version = "0.1.0"

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if t.TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
skip_covered = true

[tool.coverage.run]
branch = true
core = "ctrace"
disable_warnings = [
  "module-not-imported",
  "module-not-measured",
  "no-data-collected",
]
patch = ["subprocess"]
plugins = [
  'django_coverage_plugin',
]
source = ["gourmet", "tests"]

[tool.django-stubs]
django_settings_module = "gourmet.settings"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "django.utils.csp",
  "readable_log_formatter",
  "wsgi_basic_auth",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = [
  "--allow-hosts=127.0.0.1,localhost",
  "--ds=gourmet.settings",
  "--allow-unix-socket",  # Allow async
  "--disable-socket",  # Prevent network calls.
  "--fail-on-template-vars",  # Yell at invalid variables in templates
  "--reuse-db",  # Reuse by default. Use --create-db to recreate test dbs.
  "--strict-markers",
]
markers = [
  "server_env(env_dict): Pass environment variables to server fixture",
]

[tool.pytest_env]
DEBUG = 0
SENTRY_DSN = ""
TEMPLATE_DEBUG = 1

[tool.ruff]
extend-exclude = ["migrations", "typings"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
  "ARG001",  # Unused function argument (request, ...)
  "ARG002",  # Unused method argument (*args, **kwargs)
  "COM812",  # Check absence of trailing commas. Made redundant by formatter.
  "D",       # Missing or badly formatted docstrings
  "FBT",     # Flake Boolean Trap (don't use arg=True in functions)
  "PLR2004", # Allow "magic values" (e.g. status_code == 302)
  "RUF012",  # Mutable class attributes
  "DJ001",   # Avoid nullable CharField/TextField
]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "DJ",  # flake8-django
  "T20", # flake8-print
]

[tool.djlint]
ignore = "H006,H030,H031"
indent = 2
profile = "django"

[tool.ruff.lint.extend-per-file-ignores]
"**/migrations/*" = [
  "E501",  # Allow exceeded line length in migrations.
]
"**/tests/**/*" = [
  "S101",  # Allow use of asserts
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
