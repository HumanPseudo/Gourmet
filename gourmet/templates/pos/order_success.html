{% extends "base.html" %}
{% block head_title %}Pedido Confirmado | Gourmet{% endblock %}
{% block content %}
  <div class="flex min-h-screen items-center justify-center bg-gray-100">
    <div class="max-w-md rounded-lg bg-white p-8 text-center shadow-lg">
      <div class="mb-4 text-6xl">✅</div>
      <h1 class="mb-4 text-2xl font-bold text-green-600">¡Pedido Enviado a Cocina!</h1>
      <p class="mb-2 text-gray-600">Mesa: <strong>{{ table.code }}</strong></p>
      <p class="mb-6 text-gray-600">Orden: <strong>#{{ order.pk }}</strong></p>
      <p class="mb-6 text-sm text-gray-500">
        Tu mesero te atenderá cuando el pedido esté listo.
      </p>
      <a
        href="{% url 'menu_public' table.code %}"
        class="text-blue-600 hover:underline"
      >
        ← Volver al menú
      </a>
    </div>
  </div>
{% endblock %}
