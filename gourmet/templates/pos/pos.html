<!doctype html>
{% load static %}
<html>
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>POS | Gourmet</title>
  <link rel="stylesheet" href="{% static 'bundles/main.css' %}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .pos-btn { min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; border-radius: 8px; border: 2px solid #dee2e6; background: #fff; cursor: pointer; font-size: 14px; transition: all .15s; }
    .pos-btn:hover { border-color: #007bff; background: #f0f7ff; }
    .pos-btn:active { transform: scale(.96); }
    .pos-btn .price { font-size: 18px; font-weight: 700; color: #28a745; }
    .pos-btn .name { font-size: 13px; color: #333; text-align: center; word-break: break-word; }
    .cat-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid #dee2e6; background: #f8f9fa; cursor: pointer; font-size: 13px; transition: all .15s; white-space: nowrap; }
    .cat-tab.active { background: #007bff; color: #fff; border-color: #007bff; }
    .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #dee2e6; background: #f8f9fa; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
    .qty-btn:hover { background: #e9ecef; }
    .cart-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    .pay-btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; text-align: center; }
    .pay-btn.selected { outline: 4px solid #ffc107; outline-offset: 2px; }
  </style>
</head>
<body>

<div x-data="posApp" style="display:flex;flex-direction:column;height:100vh;">
  <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:#f8f9fa;border-bottom:1px solid #dee2e6;flex-shrink:0;">
    <span style="font-weight:bold;font-size:18px;color:#333;">Gourmet POS</span>
    <a href="{% url 'order_list' %}" style="color:#555;text-decoration:none;font-size:13px;">📋 Órdenes</a>
    <a href="{% url 'kitchen' %}" style="color:#555;text-decoration:none;font-size:13px;">🍳 Cocina</a>
    <div style="flex:1;"></div>
    <label style="font-weight:600;font-size:14px;">Mesa:</label>
    <select x-model="tableId" style="padding:6px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
      <option value="">Seleccionar mesa</option>
      {% for table in tables %}
        <option value="{{ table.pk }}">{{ table.code }}</option>
      {% endfor %}
    </select>
    <template x-if="orderId">
      <span style="background:#28a745;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;">
        Orden #<span x-text="orderId.slice(0,8)"></span>
      </span>
    </template>
    <button @click="resetAll()" style="background:#dc3545;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;">⟳ Nueva</button>
    <a href="{% url 'index' %}" style="color:#999;text-decoration:none;font-size:12px;margin-left:4px;">Salir</a>
  </div>

  <div style="display:flex;flex:1;overflow:hidden;">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <div style="display:flex;gap:6px;padding:8px 16px;flex-shrink:0;background:#fff;border-bottom:1px solid #eee;">
        <input type="text" x-model="search" placeholder="🔍 Buscar producto..." style="flex:1;padding:8px 12px;border:1px solid #ccc;border-radius:20px;font-size:14px;">
      </div>
      <div style="display:flex;gap:6px;padding:8px 16px;overflow-x:auto;flex-shrink:0;background:#fff;border-bottom:1px solid #eee;">
        <button class="cat-tab" :class="{ active: activeCat === '' }" @click="activeCat = ''">Todas</button>
        <template x-for="cat in categories" :key="cat.id">
          <button class="cat-tab" :class="{ active: activeCat === cat.id }" @click="activeCat = cat.id" x-text="cat.name"></button>
        </template>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px;">
        <div x-text="loadError" style="color:#dc3545;font-size:13px;padding:20px;text-align:center;" x-show="loadError"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;">
          <template x-for="p in filteredProducts" :key="p.id">
            <button class="pos-btn" @click="addItem(p)">
              <div class="name" x-text="p.name"></div>
              <div class="price" x-text="'$' + parseFloat(p.price).toFixed(2)"></div>
            </button>
          </template>
        </div>
      </div>
    </div>

    <div style="width:380px;display:flex;flex-direction:column;border-left:1px solid #dee2e6;background:#fff;flex-shrink:0;">
      <div style="padding:12px 16px;border-bottom:1px solid #eee;font-weight:700;font-size:16px;">
        Carrito <span x-text="'(' + cart.length + ')'" style="color:#666;"></span>
      </div>
      <div style="padding:8px 16px;border-bottom:1px solid #eee;display:flex;gap:8px;">
        <input type="text" x-model="customerName" placeholder="Cliente (opcional)" style="flex:1;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
        <input type="number" x-model="orderDiscount" step="0.01" min="0" placeholder="$ desc" style="width:80px;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
      </div>
      <div style="flex:1;overflow-y:auto;padding:0 16px;">
        <template x-if="cart.length === 0 && !orderId">
          <div style="text-align:center;padding:40px 0;color:#999;font-size:14px;">Selecciona productos</div>
        </template>
        <template x-if="cart.length === 0 && orderId">
          <div style="text-align:center;padding:20px 0;color:#999;font-size:13px;">
            <div style="font-size:24px;margin-bottom:8px;">✅</div>
            Orden #<span x-text="orderId.slice(0,8)"></span><br>
            <span style="font-size:11px;">Agrega más productos arriba</span>
          </div>
        </template>
        <template x-for="(item, idx) in cart" :key="idx">
          <div class="cart-item">
            <div style="flex:1;">
              <div x-text="item.name" style="font-weight:600;font-size:14px;"></div>
              <div style="font-size:12px;color:#666;">
                $<span x-text="parseFloat(item.price).toFixed(2)"></span>
              </div>
            </div>
            <button class="qty-btn" @click="changeQty(idx,-1)" :disabled="item.qty<=1">−</button>
            <span x-text="item.qty" style="font-weight:700;font-size:16px;min-width:24px;text-align:center;"></span>
            <button class="qty-btn" @click="changeQty(idx,1)">+</button>
            <div style="text-align:right;min-width:70px;">
              <div style="font-weight:700;font-size:14px;" x-text="'$'+(item.price*item.qty).toFixed(2)"></div>
            </div>
            <button @click="removeItem(idx)" style="background:none;border:none;color:#dc3545;cursor:pointer;font-size:18px;padding:4px;">✕</button>
          </div>
        </template>
      </div>
      <div style="padding:12px 16px;border-top:1px solid #dee2e6;background:#f8f9fa;">
        <template x-if="cart.length > 0">
          <div>
            <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;">
              <span>Subtotal</span>
              <span x-text="'$' + subtotal.toFixed(2)"></span>
            </div>
            <template x-for="(amount, label) in taxBreakdown" :key="label">
              <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;">
                <span x-text="label"></span>
                <span x-text="'$' + amount.toFixed(2)"></span>
              </div>
            </template>
            <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-top:6px;padding-top:8px;border-top:2px solid #dee2e6;">
              <span>Total</span>
              <span x-text="'$' + total.toFixed(2)"></span>
            </div>
          </div>
        </template>
        <template x-if="cart.length === 0 && orderId">
          <div>
            <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;">
              <span>Subtotal</span>
              <span x-text="'$' + orderSubtotal.toFixed(2)"></span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-top:6px;padding-top:8px;border-top:2px solid #dee2e6;">
              <span>Total</span>
              <span x-text="'$' + orderTotal.toFixed(2)"></span>
            </div>
          </div>
        </template>

        <template x-if="!orderId">
          <div>
            <button @click="createOrder()" :disabled="cart.length===0" style="width:100%;padding:14px;margin-top:12px;border:none;border-radius:8px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:#007bff;">
              🛒 Crear orden
            </button>
            <div x-text="createOrderError" style="color:#dc3545;font-size:12px;margin-top:4px;"></div>
          </div>
        </template>
        <template x-if="orderId && !closed">
          <button @click="addItems()" :disabled="cart.length===0" style="width:100%;padding:14px;margin-top:12px;border:none;border-radius:8px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:#ffc107;">
            ➕ Agregar items
          </button>
        </template>

        <template x-if="orderId && !closed">
          <div style="margin-top:12px;">
            <div style="font-weight:700;font-size:14px;margin-bottom:8px;">Pagar</div>
            <div style="display:flex;gap:6px;margin-bottom:8px;">
              <template x-for="m in methods" :key="m.value">
                <button class="pay-btn" :class="{selected:payMethod===m.value}" :style="{background:m.color}" @click="payMethod=m.value" x-text="m.label"></button>
              </template>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:8px;">
              <input type="number" x-model="payAmount" step="0.01" :placeholder="'Monto ($'+remaining.toFixed(2)+')'" style="flex:1;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:16px;">
              <input type="number" x-model="tipAmount" step="0.01" placeholder="Propina ($0)" style="width:90px;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
              <button @click="pay()" :disabled="!payMethod||payAmount<=0" style="padding:10px 20px;border:none;border-radius:6px;background:#28a745;color:#fff;font-weight:700;cursor:pointer;font-size:14px;">💳 Pagar</button>
            </div>
            <div x-text="payError" style="color:#dc3545;font-size:12px;margin-bottom:4px;"></div>
            <div style="font-size:13px;color:#666;margin-bottom:8px;">
              Pagado: $<span x-text="totalPaid.toFixed(2)"></span> / por pagar: $<span x-text="remaining.toFixed(2)"></span>
            </div>
            <button @click="closeOrder()" :disabled="remaining>0.005" style="width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:#17a2b8;" x-text="remaining>0.005?'Pendiente de pago':'✅ Cerrar orden'"></button>
            <div x-text="closeError" style="color:#dc3545;font-size:12px;margin-top:4px;"></div>
          </div>
        </template>

        <template x-if="closed">
          <div style="margin-top:12px;">
            <div style="background:#d4edda;border:1px solid #c3e6cb;color:#155724;padding:16px;border-radius:8px;text-align:center;font-weight:700;font-size:16px;">
              ✅ Orden cerrada<br>
              <span style="font-size:14px;font-weight:400;">Total: $<span x-text="orderTotal.toFixed(2)"></span></span>
            </div>
            <a :href="'/pos/orders/' + orderId + '/print/'" target="_blank" style="display:block;text-align:center;margin-top:10px;padding:10px;background:#007bff;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;font-size:14px;">🖨️ Ver recibo</a>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'vendor/htmx.min.js' %}"></script>
<script defer src="{% static 'vendor/alpine.min.js' %}"></script>
<script src="{% static 'pos.js' %}"></script>
</body>
</html>
