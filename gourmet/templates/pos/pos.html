{% extends "base.html" %}
{% block head_title %}POS | Gourmet{% endblock %}
{% block content %}
<style>
  .pos-btn { min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; border-radius: 8px; border: 2px solid #dee2e6; background: #fff; cursor: pointer; font-size: 14px; transition: all .15s; }
  .pos-btn:hover { border-color: #007bff; background: #f0f7ff; }
  .pos-btn:active { transform: scale(.96); }
  .pos-btn .price { font-size: 18px; font-weight: 700; color: #28a745; }
  .pos-btn .name { font-size: 13px; color: #333; text-align: center; word-break: break-word; }
  .pos-btn .badge-tax { font-size: 10px; padding: 1px 6px; border-radius: 8px; color: #fff; margin-top: 2px; }
  .cat-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid #dee2e6; background: #f8f9fa; cursor: pointer; font-size: 13px; transition: all .15s; white-space: nowrap; }
  .cat-tab.active { background: #007bff; color: #fff; border-color: #007bff; }
  .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #dee2e6; background: #f8f9fa; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; transition: all .1s; }
  .qty-btn:hover { background: #e9ecef; }
  .cart-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .pay-btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; text-align: center; transition: all .15s; }
  .pay-btn:active { transform: scale(.96); }
  .pay-btn.selected { outline: 4px solid #ffc107; outline-offset: 2px; }
</style>

<div x-data="posApp()" x-init="init()" style="display: flex; flex-direction: column; height: calc(100vh - 80px); padding: 0; margin: -20px; overflow: hidden;">
  <meta name="csrf-token" content="{{ csrf_token }}">

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid #dee2e6; flex-shrink: 0;">
    <a href="{% url 'index' %}" style="color: #007bff; text-decoration: none; font-weight: bold; font-size: 18px;">Gourmet POS</a>
    <div style="flex: 1;"></div>
    <label style="font-weight: 600; font-size: 14px;">Mesa:</label>
    <select x-model="tableId" style="padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
      <option value="">Sin mesa</option>
      {% for table in tables %}
        <option value="{{ table.pk }}">{{ table.code }}</option>
      {% endfor %}
    </select>
    <template x-if="orderId">
      <span style="background: #28a745; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 12px;">
        Orden #<span x-text="orderId.slice(0,8)"></span>
      </span>
    </template>
    <button @click="resetAll()" style="background: #dc3545; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;">⟳ Nueva</button>
  </div>

  <div style="display: flex; flex: 1; overflow: hidden;">
    <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      <div style="display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; flex-shrink: 0; background: #fff; border-bottom: 1px solid #eee;">
        <button class="cat-tab" :class="{ active: activeCat === '' }" @click="activeCat = ''">Todas</button>
        <template x-for="cat in categories" :key="cat.id">
          <button class="cat-tab" :class="{ active: activeCat === cat.id }" @click="activeCat = cat.id" x-text="cat.name"></button>
        </template>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 12px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;">
          <template x-for="p in filteredProducts" :key="p.id">
            <button class="pos-btn" @click="addItem(p)">
              <div class="name" x-text="p.name"></div>
              <div class="price" x-text="'$' + parseFloat(p.price).toFixed(2)"></div>
              <div class="badge-tax" :style="{ background: taxColor(p.tax_type) }" x-text="taxLabel(p.tax_type)"></div>
            </button>
          </template>
        </div>
      </div>
    </div>

    <div style="width: 380px; display: flex; flex-direction: column; border-left: 1px solid #dee2e6; background: #fff; flex-shrink: 0;">
      <div style="padding: 12px 16px; border-bottom: 1px solid #eee; font-weight: 700; font-size: 16px;">
        Carrito <span x-text="'(' + cart.length + ')'" style="color: #666;"></span>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 0 16px;">
        <template x-if="cart.length === 0">
          <div style="text-align: center; padding: 40px 0; color: #999; font-size: 14px;">Selecciona productos</div>
        </template>
        <template x-for="(item, idx) in cart" :key="idx">
          <div class="cart-item">
            <div style="flex: 1;">
              <div x-text="item.name" style="font-weight: 600; font-size: 14px;"></div>
              <div style="font-size: 12px; color: #666;">
                $<span x-text="parseFloat(item.price).toFixed(2)"></span>
                <span class="badge-tax" :style="{ background: taxColor(item.tax_type) }" x-text="taxLabel(item.tax_type)" style="margin-left: 6px;"></span>
              </div>
            </div>
            <button class="qty-btn" @click="changeQty(idx, -1)" :disabled="item.qty <= 1" style="opacity: 1;">−</button>
            <span x-text="item.qty" style="font-weight: 700; font-size: 16px; min-width: 24px; text-align: center;"></span>
            <button class="qty-btn" @click="changeQty(idx, 1)">+</button>
            <div style="text-align: right; min-width: 70px;">
              <div style="font-weight: 700; font-size: 14px;" x-text="'$' + (item.price * item.qty).toFixed(2)"></div>
            </div>
            <button @click="removeItem(idx)" style="background: none; border: none; color: #dc3545; cursor: pointer; font-size: 18px; padding: 4px;">✕</button>
          </div>
        </template>
      </div>
      <div style="padding: 12px 16px; border-top: 1px solid #dee2e6; background: #f8f9fa;">
        <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px;">
          <span>Subtotal</span>
          <span x-text="'$' + subtotal.toFixed(2)"></span>
        </div>
        <template x-for="(amount, label) in taxBreakdown" :key="label">
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #666;">
            <span x-text="label"></span>
            <span x-text="'$' + amount.toFixed(2)"></span>
          </div>
        </template>
        <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-top: 6px; padding-top: 8px; border-top: 2px solid #dee2e6;">
          <span>Total</span>
          <span x-text="'$' + total.toFixed(2)"></span>
        </div>

        <template x-if="!orderId">
          <button @click="createOrder()" :disabled="cart.length === 0" style="width: 100%; padding: 14px; margin-top: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; background: #007bff; transition: all .15s;">
            🛒 Crear orden
          </button>
        </template>

        <template x-if="orderId && !closed">
          <div style="margin-top: 12px;">
            <div style="font-weight: 700; font-size: 14px; margin-bottom: 8px;">Pagar</div>
            <div style="display: flex; gap: 6px; margin-bottom: 8px;">
              <template x-for="m in methods" :key="m.value">
                <button class="pay-btn" :class="{ selected: payMethod === m.value }" :style="{ background: m.color }" @click="payMethod = m.value" x-text="m.label"></button>
              </template>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
              <input type="number" x-model="payAmount" step="0.01" :placeholder="'Monto ($' + remaining.toFixed(2) + ')'" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">
              <button @click="pay()" :disabled="!payMethod || payAmount <= 0" style="padding: 10px 20px; border: none; border-radius: 6px; background: #28a745; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px;">💳 Pagar</button>
            </div>
            <div x-text="payError" style="color: #dc3545; font-size: 12px; margin-bottom: 4px;"></div>
            <div style="font-size: 13px; color: #666; margin-bottom: 8px;">
              Pagado: $<span x-text="totalPaid.toFixed(2)"></span> /
              por pagar: $<span x-text="remaining.toFixed(2)"></span>
            </div>
            <button @click="closeOrder()" :disabled="remaining > 0.005" style="width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; background: #17a2b8;" x-text="remaining > 0.005 ? 'Pendiente de pago' : '✅ Cerrar orden'"></button>
            <div x-text="closeError" style="color: #dc3545; font-size: 12px; margin-top: 4px;"></div>
          </div>
        </template>

        <template x-if="closed">
          <div style="margin-top: 12px;">
            <div style="background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 16px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 16px;">
              ✅ Orden cerrada<br>
              <span style="font-size: 14px; font-weight: 400;">Total: $<span x-text="total.toFixed(2)"></span></span>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

<script>
function posApp() {
  return {
    categories: [], products: [], activeCat: '',
    cart: [], tableId: '', orderId: null,
    payMethod: 'cash', payAmount: 0, payError: '',
    totalPaid: 0, closeError: '', closed: false,
    methods: [
      { value: 'cash', label: '💵 Efectivo', color: '#28a745' },
      { value: 'card', label: '💳 Tarjeta', color: '#007bff' },
      { value: 'transfer', label: '🏦 Transf.', color: '#6f42c1' },
    ],
    taxLabels: { INC_8: 'INC 8%', IVA_19: 'IVA 19%', IVA_5: 'IVA 5%', EXENTO: 'Exento' },
    taxColors: { INC_8: '#17a2b8', IVA_19: '#dc3545', IVA_5: '#ffc107', EXENTO: '#6c757d' },
    taxRates: { INC_8: 0.08, IVA_19: 0.19, IVA_5: 0.05, EXENTO: 0.0 },

    get csrf() { return document.querySelector('meta[name=csrf-token]')?.content || ''; },

    async init() {
      const [cats, prods] = await Promise.all([
        fetch('/api/menu/categories').then(r => r.json()),
        fetch('/api/menu/products').then(r => r.json()),
      ]);
      this.categories = cats.items || cats || [];
      this.products = (prods.items || prods || []).filter(p => p.is_available);
    },

    get filteredProducts() {
      if (!this.activeCat) return this.products;
      return this.products.filter(p => p.category_id === this.activeCat);
    },

    get subtotal() {
      return this.cart.reduce((s, i) => s + i.price * i.qty, 0);
    },

    get taxBreakdown() {
      const map = {};
      for (const item of this.cart) {
        const label = this.taxLabels[item.tax_type] || item.tax_type;
        const rate = this.taxRates[item.tax_type] || 0;
        const tax = item.price * item.qty * rate;
        map[label] = (map[label] || 0) + tax;
      }
      return map;
    },

    get total() {
      let t = this.subtotal;
      for (const item of this.cart) {
        t += item.price * item.qty * (this.taxRates[item.tax_type] || 0);
      }
      return t;
    },

    get remaining() { return Math.max(0, this.total - this.totalPaid); },

    taxLabel(t) { return this.taxLabels[t] || t; },
    taxColor(t) { return this.taxColors[t] || '#6c757d'; },

    addItem(p) {
      const existing = this.cart.find(i => i.id === p.id);
      if (existing) { existing.qty++; return; }
      this.cart.push({ id: p.id, name: p.name, price: parseFloat(p.price), tax_type: p.tax_type, qty: 1 });
    },

    changeQty(idx, delta) {
      const item = this.cart[idx];
      if (!item) return;
      item.qty = Math.max(1, item.qty + delta);
    },

    removeItem(idx) { this.cart.splice(idx, 1); },

    async createOrder() {
      if (this.cart.length === 0) return;
      const res = await fetch('/pos/create/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.csrf },
        body: JSON.stringify({
          table_id: this.tableId || null,
          items: this.cart.map(i => ({ product_id: i.id, quantity: i.qty })),
        }),
      });
      if (!res.ok) return;
      const data = await res.json();
      this.orderId = data.id;
      this.cart = [];
      this.totalPaid = parseFloat(data.total_paid || 0);
    },

    async pay() {
      this.payError = '';
      const res = await fetch('/pos/pay/' + this.orderId + '/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.csrf },
        body: JSON.stringify({ method: this.payMethod, amount: parseFloat(this.payAmount) }),
      });
      if (!res.ok) { const err = await res.json(); this.payError = err.error || 'Error'; return; }
      const data = await res.json();
      this.totalPaid += parseFloat(data.amount);
      this.payAmount = 0;
      this.payError = '';
    },

    async closeOrder() {
      this.closeError = '';
      const res = await fetch('/pos/close/' + this.orderId + '/', {
        method: 'POST',
        headers: { 'X-CSRFToken': this.csrf },
      });
      if (!res.ok) { const err = await res.json(); this.closeError = err.error || 'Error'; return; }
      this.closed = true;
    },

    resetAll() {
      this.cart = []; this.orderId = null; this.payMethod = 'cash';
      this.payAmount = 0; this.payError = ''; this.totalPaid = 0;
      this.closeError = ''; this.closed = false;
    },
  };
}
</script>
{% endblock %}
